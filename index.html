async function importShot(file){

  shotMsg('Preparing the image…',.05);const cv=await shotCanvas(file);
  shotMsg('Loading the text reader (first time can take a minute)…',.1);const T=await loadTess();

  if(o.err)return shotMsg(o.err+'<p><button class="g b" onclick="closeSheet()">Close</button></p>');
  if(!o.rows.length)return shotMsg('I could not find any classes with days and times in that image. Try a sharper, closer screenshot of just the table.'+'<p><button class="g b" onclick="closeSheet()">Close</button></p>');
  const have=new Set(classes.map(c=>(c.code||'').toLowerCase().replace(/\s+/g,'')));
  _imp=o.rows.map(x=>({...x,on:!have.has(x.code.toLowerCase().replace(/\s+/g,'')),dup:have.has(x.code.toLowerCase().replace(/\s+/g,''))}));
