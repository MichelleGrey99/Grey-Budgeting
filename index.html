<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const money=n=>'R'+Math.round(n||0).toLocaleString('en-ZA'),addM=(k,i)=>{const[y,m]=k.split('-').map(Number),d=new Date(y,m-1+i,1);return d.getFullYear()+'-'+p2(d.getMonth()+1)},mlab=k=>MN[+k.slice(5)-1]+' '+k.slice(0,4);

let db,user,uid,me=null,base,classes=[],att={},pays={},profiles={},sums={},buds={},set={rate:18.4315,remind:5},tab='dash',cur=ymd(new Date()).slice(0,7),f={q:'',st:'',day:''},pend=false,lastPub='';

const tOf=(c,s)=>{const d=s?new Date(s+'T12:00').getDay():-1;return(c.dow2!=null&&d===c.dow2&&c.dow2!==c.dow&&c.st2&&c.en2)?{st:c.st2,en:c.en2}:{st:c.st,en:c.en}};

function occ(c,ym){const[y,m]=ym.split('-').map(Number),n=new Date(y,m,0).getDate(),r=[];for(let d=1;d<=n;d++){const dt=new Date(y,m-1,d),s=ymd(dt);if(c.recur===false){if(s===c.once)r.push(s);continue}if((dt.getDay()!==c.dow&&dt.getDay()!==c.dow2)||s<(c.from||'0')||(c.until&&s>c.until))continue;r.push(s)}return r}

function tot(ym,list=classes){let done=0,pred=0,dh=0,ph=0,ch=0,md=0,mp=0;for(const c of list){const pv=/^\s*pvt/i.test(c.company||'');for(const s of occ(c,ym)){const t=status(c,s),h=A(c,s)?.hrs??hrs(c,s);if(t==='completed'){done+=zar(c,s);dh+=h;if(!pv)md+=zar(c,s)}else if(t==='cancelled')ch+=h;else{pred+=zar(c,s);ph+=h;if(!pv)mp+=zar(c,s)}}}return{done,pred,dh,ph,ch,md,mp}}
const autoOn=()=>cur>=ymd(new Date()).slice(0,7),autoRows=()=>autoOn()?Object.values(sums).map(s=>({n:s.name,d:s.months[cur]?.mdone||0,p:s.months[cur]?.mpred||0})).sort((a,b)=>a.n.localeCompare(b.n)):[],autoMain=()=>autoRows().reduce((a,x)=>a+x.d+x.p,0);
function pendingList(){const o=[],now=ymd(new Date());for(let i=-1;i<=0;i++)for(const c of classes)for(const s of occ(c,addM(now.slice(0,7),i)))if(s<=now&&status(c,s)==='pending')o.push([c,s]);return o.sort((a,b)=>b[1].localeCompare(a[1])||cmp(a[0],b[0]))}

function render(){const ae=document.activeElement;if(ae&&/INPUT|SELECT|TEXTAREA/.test(ae.tagName)&&$('#app').contains(ae)){pend=true;return}pend=false;if(!uid){$('#nav').innerHTML='';$('#app').innerHTML=loginHtml();return}pub();
 $('#nav').innerHTML=[['dash',ic('M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10'),'Home'],['trk',ic('M4 5h16v15H4zM4 10h16M9 3v4M15 3v4'),'My classes'],['bud',ic('M3 7h18v12H3zM3 11h18M7 15h3'),'Budget'],['plan',ic('M3 20h18M6 16v-5M11 16V7M16 16v-8M21 16v-3'),'Planner'],['set',ic('M4 7h10M18 7h2M4 17h2M10 17h10M16 4v6M8 14v6'),'Settings']].map(([k,i,l])=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';render()"><b>${i}</b>${l}</button>`).join('');
 if(!me){$('#app').innerHTML=`<div class="card"><h2>Who are you?</h2><p class="mu">Each person gets a private salary tracker. Pick your name once on this account.</p><div class="row">${['Michelle','Gustav'].map(n=>{const t=Object.entries(profiles).find(([i,p])=>p.name===n&&i!==uid);return`<button class="b" ${t?'disabled':''} onclick="pick('${n}')">${n}${t?' (taken)':''}</button>`}).join('')}</div></div>`;return}
 $('#app').innerHTML={dash:vDash,trk:vTrk,bud:vBud,plan:vPlan,set:vSet}[tab]()}

function vDash(){const pl=pendingList(),rows=Object.entries(sums).map(([i,s])=>[s.name,s.months[cur]||{done:0,pred:0}]).sort((a,b)=>a[0].localeCompare(b[0])),B=buds[cur]||E0(),ex=totE(B),paid=sm(B.expenses.filter(e=>e.paid))+sm(B.pexpenses.filter(e=>e.paid)),ts=rows.reduce((a,r)=>a+r[1].done+r[1].pred,0);
 return`<h2>Hi ${esc(me.name)}</h2>${instCard()}${mnav()}<div class="card"><h3>Salary this month</h3>${rows.map(([n,t])=>`<div class="row"><span class="sp">${esc(n)}</span><span>${money(t.done)} done · ${money(t.pred)} predicted</span></div>`).join('')||'<span class="mu">No data yet</span>'}<hr style="border-color:var(--bd)"><div class="row"><span class="sp">Household expected</span><span class="big">${money(ts)}</span></div></div>
 <div class="card"><h3>Shared budget</h3><div class="row"><span class="sp">Expenses ${money(ex)} · paid ${money(paid)}</span><span class="${ts-ex<0?'':'mu'}" style="${ts-ex<0?'color:var(--no)':''}">Expected balance ${money(ts-ex)}</span></div></div>
 <div class="card"><h3>Needs your answer: ${pl.length}</h3>${pl.slice(0,5).map(([c,s])=>`<div class="row"><span class="sp">${esc(c.code)}<br><span class="mu">${s} ${tOf(c,s).st}–${tOf(c,s).en}</span></span><button class="b" onclick="setSt('${c.id}','${s}','completed')">Yes</button><button class="b g" onclick="askNo('${c.id}','${s}')">No</button></div>`).join('')||'<span class="mu">All caught up</span>'}</div>`}
function vTrk(){const q=f.q.toLowerCase();let list=classes.filter(c=>(!f.q||(c.code+c.company).toLowerCase().includes(q))&&(f.day===''||c.dow==f.day)).sort(cmp),t=tot(cur),pay=pays[cur]||{amt:0};
 const cards=list.map(c=>[c,occ(c,cur)]).filter(([c,o])=>o.length&&(!f.st||o.some(s=>status(c,s)===f.st))).map(([c,o])=>`<div class="card" style="${c.until?'opacity:.6':''}"><div class="row"><b class="sp">${esc(c.code)}</b><button class="g b" onclick="editC('${c.id}')">Edit</button></div><div class="mu">${esc(c.company)} · ${DN[c.dow]} ${c.st}–${c.en}${c.dow2!=null?' · '+DN[c.dow2]+' '+(c.st2||c.st)+'–'+(c.en2||c.en):''} · ${hrs(c).toFixed(2)}h · ${c.rate} ${c.cur}/h${c.until?' · inactive':''}${c.recur===false?' · once':''}</div><div class="chips">${o.map(s=>{const st=status(c,s);return`<button class="chip ${st}" onclick="askSt('${c.id}','${s}')">${DS[new Date(s+'T12:00').getDay()]} ${+s.slice(8)}</button>`}).join('')}</div></div>`).join('');
 return`<h2>${esc(me.name)}'s classes</h2>${mnav()}<div class="card"><div class="row"><span class="sp mu">Completed</span><b>${money(t.done)} · ${t.dh}h</b></div><div class="row"><span class="sp mu">Predicted</span><b>${money(t.pred)} · ${t.ph}h</b></div><div class="row"><span class="sp mu">Cancelled</span><b>${t.ch}h</b></div><div class="row" style="margin-top:6px"><span class="sp mu">Payment received (R)</span><input type="number" style="width:110px" value="${pay.amt||''}" onchange="payS(+this.value)"></div><div class="mu">Still to receive: ${money(t.done-(pay.amt||0))}</div></div>
 <div class="row"><input class="sp" placeholder="Search code / company" value="${esc(f.q)}" oninput="f.q=this.value;clearTimeout(window._t);window._t=setTimeout(render,400)"><select onchange="f.day=this.value;render()"><option value="">Day</option>${DO.map(d=>`<option value="${d}" ${f.day==d?'selected':''}>${DN[d].slice(0,3)}</option>`).join('')}</select><select onchange="f.st=this.value;render()"><option value="">Status</option>${['predicted','completed','cancelled','pending'].map(s=>`<option value="${s}" ${f.st===s?'selected':''}>${s}</option>`).join('')}</select></div>
 <p class="row"><button class="b" onclick="editC()">+ Add class</button><span class="mu">A–Z by code</span></p>${cards||'<p class="mu">No classes this month.</p>'}`}
let bsub='main';
const E0=()=>({income:[],expenses:[],savings:[],pincome:[],pexpenses:[]}),sm=(l)=>(l||[]).reduce((a,e)=>a+(+e.amt||0),0),totE=B=>sm(B.expenses)+sm(B.pexpenses);
function vBud(){const B=buds[cur]||E0(),pv=bsub==='pvt',ik=pv?'pincome':'income',ek=pv?'pexpenses':'expenses',IL=B[ik]||[],EL=B[ek]||[],AU=pv?[]:autoRows(),I=sm(IL)+(pv?0:autoMain()),E=sm(EL),P=sm(EL.filter(e=>e.paid)),S=sm(B.savings);
 const inp=(k,i,fl,v,t='text',w='')=>`<input ${w?`style="width:${w}"`:''} type="${t}" value="${esc(v??'')}" onchange="bset('${k}',${i},'${fl}',${t==='number'?'+this.value':'this.value'})">`;
 const sel=(k,i,fl,v,opts)=>`<select onchange="bset('${k}',${i},'${fl}',this.value)">${opts.map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('')}</select>`;
 const WITH=['','Pay with Astex','Pay with Pvt Stud'];
 return`<h2>Shared budget</h2>${mnav()}<div class="row" style="margin:8px 0"><button class="b ${pv?'g':''}" onclick="bsub='main';render()">Main (Astex)</button><button class="b ${pv?'':'g'}" onclick="bsub='pvt';render()">Private students</button></div>
 <div class="card"><div class="row"><span class="sp">Income</span><b>${money(I)}</b></div><div class="row"><span class="sp">Expenses</span><b>${money(E)}</b></div><div class="row"><span class="sp">Balance (Income − Expenses)</span><b class="big" style="${I-E<0?'color:var(--no)':''}">${money(I-E)}</b></div><div class="mu">${E?Math.round(P/E*100):0}% paid · both budgets combined: ${money(sm(B.income)+autoMain()+sm(B.pincome)-totE(B))}</div></div>
 <div class="card"><h3>${pv?'Private student income':'Permanent salary'}</h3>${AU.map(x=>`<div class="row" style="padding:4px 0;border-bottom:1px solid var(--bd)"><span class="sp">Class earnings - ${esc(x.n)} <span class="mu">(auto)</span><br><span class="mu">completed ${money(x.d)} + predicted ${money(x.p)}</span></span><b>${money(x.d+x.p)}</b></div>`).join('')}${IL.map((e,i)=>`<div class="row" style="padding:4px 0;border-bottom:1px solid var(--bd)">${inp(ik,i,'src',e.src,'text','100%')}${sel(ik,i,'who',e.who||'',['','Michelle','Gustav'])}${inp(ik,i,'date',e.date,'text','60px')}${inp(ik,i,'amt',e.amt,'number','90px')}${sel(ik,i,'rcv2',e.rcv?'Yes':'No',['Yes','No']).replace("'rcv2'","'rcv'").replace('this.value)','this.value===\'Yes\')')}${pv?sel(ik,i,'payer',e.payer||'',['','On time','Late']):''}<button class="g b" onclick="bdel('${ik}',${i})">✕</button></div>`).join('')}<p><button class="b g" onclick="badd('${ik}',{src:'',who:'',date:'',amt:0,rcv:false,payer:''})">+ Income</button></p><div class="mu">${pv?'':'Salary from classes fills in automatically from current month on. '}Fields: source · recipient · expected date · amount · received · ${pv?'payer':''}</div></div>
 <div class="card"><h3>Expenses</h3>${EL.map((e,i)=>`<div class="row" style="padding:4px 0;border-bottom:1px solid var(--bd)">${inp(ek,i,'name',e.name,'text','100%')}${inp(ek,i,'amt',e.amt,'number','90px')}<select onchange="bset('${ek}',${i},'paid',this.value==='1')"><option value="1" ${e.paid?'selected':''}>Paid</option><option value="0" ${e.paid?'':'selected'}>Not Paid</option></select>${sel(ek,i,'with',e.with||'',WITH)}<span class="mu">${E?Math.round((+e.amt||0)/E*100):0}%</span><button class="g b" onclick="bdel('${ek}',${i})">✕</button></div>`).join('')}<p><button class="b g" onclick="badd('${ek}',{name:'',amt:0,paid:false,with:''})">+ Expense</button></p></div>
 ${pv?'':`<div class="card"><h3>Savings this month</h3>${B.savings.map((e,i)=>`<div class="row">${inp('savings',i,'cat',e.cat,'text','50%')}${inp('savings',i,'amt',e.amt,'number','90px')}<button class="g b" onclick="bdel('savings',${i})">✕</button></div>`).join('')}<p><button class="b g" onclick="badd('savings',{cat:'',amt:0})">+ Savings</button></p><div class="mu">Saved: ${money(S)}</div></div>`}
 <button class="b g" onclick="copyPrev()">Copy both budgets from previous month</button>`}
function vPlan(){const n0=ymd(new Date()).slice(0,7),ks=[0,1,2,3,4,5].map(i=>addM(n0,i)),last=Object.keys(buds).sort().filter(k=>k<=n0).pop(),base=last?totE(buds[last]):0;
 const rows=ks.map(k=>{const by=Object.values(sums).map(s=>({n:s.name,v:(s.months[k]?.done||0)+(s.months[k]?.pred||0)})).sort((a,b)=>a.n.localeCompare(b.n)),inc=by.reduce((a,x)=>a+x.v,0),e=buds[k]?totE(buds[k]):base;return`<tr><td>${mlab(k)}</td>${by.map(x=>`<td>${money(x.v)}</td>`).join('')}<td><b>${money(inc)}</b></td><td>${money(e)}</td><td style="color:var(${inc-e<0?'--no':'--ok'})"><b>${money(inc-e)}</b></td></tr>`}).join('');
 const hd=Object.values(sums).map(s=>s.name).sort();return`<h2>Six-month planner</h2><p class="mu">Salaries are forecast from each person's recurring classes (cancelled excluded). Expenses use that month's budget, or your latest month.</p><div class="card tbl"><table style="width:100%;border-collapse:collapse;text-align:left"><tr><th>Month</th>${hd.map(h=>`<th>${esc(h)}</th>`).join('')}<th>Income</th><th>Costs</th><th>Net</th></tr>${rows}</table></div>`}
function vSet(){const perm='Notification' in window?Notification.permission:'n/a';return`<h2>Settings</h2>${instCard()}<div class="card"><h3>Household</h3>${Object.values(profiles).map(p=>`<div>${esc(p.name)}</div>`).join('')}<p class="mu">Each of you signs in with your own email and picks your name once.</p></div>

const close=()=>sheet('');window.onkeydown=e=>{if(e.key==='Escape')close()};
function editC(id){const c=id?classes.find(x=>x.id===id):{company:'',code:'',dow:1,st:'09:00',en:'10:00',rate:18,cur:'EUR',recur:true,from:ymd(new Date()),notes:''};
 sheet(`<h3>${id?'Edit':'Add'} class</h3><label>Student / class code</label><input id="f_code" value="${esc(c.code)}"><label>Company</label><input id="f_co" value="${esc(c.company)}"><div class="g2"><div><label>Day</label><select id="f_dow">${DO.map(d=>`<option value="${d}" ${c.dow==d?'selected':''}>${DN[d]}</option>`).join('')}</select></div><div><label>Repeats</label><select id="f_rec"><option value="1" ${c.recur!==false?'selected':''}>Weekly (future months)</option><option value="0" ${c.recur===false?'selected':''}>Once</option></select></div><div><label>Second day (twice a week)</label><select id="f_dow2"><option value="">None</option>${DO.map(d=>`<option value="${d}" ${c.dow2===d?'selected':''}>${DN[d]}</option>`).join('')}</select></div><div><label>Second day start</label><input type="time" id="f_st2" value="${c.st2||''}"></div><div><label>Second day end</label><input type="time" id="f_en2" value="${c.en2||''}"></div><div><label>Start</label><input type="time" id="f_st" value="${c.st}"></div><div><label>End</label><input type="time" id="f_en" value="${c.en}"></div><div><label>Rate / hour</label><input type="number" step="0.01" id="f_rate" value="${c.rate}"></div><div><label>Currency</label><select id="f_cur"><option ${c.cur==='EUR'?'selected':''}>EUR</option><option ${c.cur==='ZAR'?'selected':''}>ZAR</option></select></div></div><label>Starts on (weekly) / date (once)</label><input type="date" id="f_from" value="${c.recur===false?c.once:c.from}"><label>Notes</label><textarea id="f_n">${esc(c.notes)}</textarea><p class="mu">Changes apply from the start date; confirmed classes keep their original rate and hours.</p>
 <div class="row"><button class="b" onclick="saveC('${id||''}')">Save</button><button class="g b" onclick="close()">Cancel</button>${id?`<span class="sp"></span><button class="g b" onclick="dupC('${id}')">Duplicate</button><button class="g b" onclick="togC('${id}')">${c.until?'Reactivate':'Deactivate'}</button><button class="g b" style="color:var(--no)" onclick="delC('${id}')">Delete</button>`:''}</div>`)}
function saveC(id){const v=i=>$('#f_'+i).value,rec=v('rec')==='1',old=classes.find(x=>x.id===id)||{};if(!v('code').trim())return alert('Please enter a code');if(tm(v('en'))<=tm(v('st'))||(v('st2')&&v('en2')&&tm(v('en2'))<=tm(v('st2'))))return alert('End time must be after start time');
 const d={...old,code:v('code').trim(),company:v('co').trim(),dow:+v('dow'),dow2:(v('dow2')===''||v('dow2')===v('dow'))?null:+v('dow2'),st2:(v('dow2')===''||v('dow2')===v('dow'))?null:(v('st2')||v('st')),en2:(v('dow2')===''||v('dow2')===v('dow'))?null:(v('en2')||v('en')),st:v('st'),en:v('en'),rate:+v('rate'),cur:v('cur'),notes:v('n'),recur:rec,from:rec?v('from'):null,once:rec?null:v('from')};delete d.id;
 const nid=id||'c_'+Date.now().toString(36);save(nid,d);close()}
function dupC(id){const c={...classes.find(x=>x.id===id)};delete c.id;delete c.until;c.code+=' (copy)';save('c_'+Date.now().toString(36),c);close()}
function togC(id){const c={...classes.find(x=>x.id===id)};delete c.id;if(c.until)delete c.until;else c.until=ymd(new Date());save(id,c);close()}
async function delC(id){if(!confirm('Delete this class and its attendance records? Deactivate instead to keep history.'))return;await col().doc(id).delete();for(const k of Object.keys(att))if(k.startsWith(id+'_'))await col().doc('a_'+k).delete();close()}
function askSt(id,s){const c=classes.find(x=>x.id===id);sheet(`<h3>${esc(c.code)}</h3><p class="mu">${s} · ${tOf(c,s).st}–${tOf(c,s).en} · now ${status(c,s)}</p><p><b>Did this class take place?</b></p><div class="row"><button class="b" style="background:var(--ok)" onclick="setSt('${id}','${s}','completed')">Yes – completed</button><button class="b" style="background:var(--no)" onclick="askNo('${id}','${s}')">No</button></div><p><button class="g b" onclick="setSt('${id}','${s}','')">Reset to predicted / pending</button> <button class="g b" onclick="close()">Close</button></p>`)}
function askNo(id,s){sheet(`<h3>Not completed</h3><label>Reason (optional)</label><select id="f_r"><option>Student absence</option><option>Cancelled by company</option><option>Cancelled by me</option><option>Public holiday</option><option>Other</option></select><p><button class="b" onclick="setSt('${id}','${s}','cancelled',$('#f_r').value)">Save</button> <button class="g b" onclick="close()">Back</button></p>`)}
function setSt(id,s,st,reason){const c=classes.find(x=>x.id===id),k='a_'+id+'_'+s;close();if(!st)return col().doc(k).delete();save(k,{status:st,reason:reason||'',rate:c.rate,hrs:hrs(c,s),cur:c.cur,at:Date.now()})}
const payS=v=>save('p_'+cur,{amt:v});
const setS=o=>{set={...set,...o};db.doc('household/settings').set(set)};
function pick(n){me={name:n};db.doc('profiles/'+uid).set({name:n}).then(()=>start());render()}
function bud(){return buds[cur]?JSON.parse(JSON.stringify(buds[cur])):E0()}
function bsave(b){buds[cur]=b;db.doc('budget/'+cur).set(b)}
function bset(k,i,fl,v){const b=bud();b[k][i][fl]=v;bsave(b);render()}
function badd(k,o){const b=bud();b[k].push(o);bsave(b);render()}
function bdel(k,i){const b=bud();b[k].splice(i,1);bsave(b);render()}
function copyPrev(){const p=buds[addM(cur,-1)];if(!p)return alert('No previous month found');const b=bud();for(const k of['expenses','pexpenses'])b[k]=(p[k]||[]).map(e=>({...e,paid:false}));for(const k of['income','pincome'])if(!(b[k]||[]).length)b[k]=(p[k]||[]).map(e=>({...e,rcv:false}));bsave(b);render()}
function notify(){if(!('Notification' in window)||Notification.permission!=='granted')return;const now=Date.now();for(const[c,s]of pendingList()){const due=new Date(s+'T'+tOf(c,s).en).getTime()+set.remind*60000,key='n_'+c.id+s;if(now<due)continue;try{if(localStorage[key])continue;localStorage[key]=1}catch(e){}new Notification('Did this class take place?',{body:c.code+' · '+s+' '+tOf(c,s).st+'–'+tOf(c,s).en})}}
let started=false;
function start(){if(started)return;started=true;base='data/users/'+uid;
 col().onSnapshot(q=>{classes=[];att={};pays={};q.docs.forEach(d=>{const x=d.data(),i=d.id;if(i[0]==='c')classes.push({...x,id:i});else if(i[0]==='a')att[i.slice(2)]=x;else if(i[0]==='p')pays[i.slice(2)]=x});render();notify()});
 db.collection('summaries').onSnapshot(q=>{q.docs.forEach(d=>{if(d.id!==uid)sums[d.id]=d.data()});render()});
 db.collection('budget').onSnapshot(q=>{buds={};q.docs.forEach(d=>{const x=d.data();buds[d.id]={...E0(),...x}});render()});
 db.doc('household/settings').onSnapshot(d=>{if(d.exists)set={...set,...d.data()};render()});
 setInterval(notify,60000);if('Notification' in window&&Notification.permission==='granted')enablePush(true)}
let dip=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;render()});window.addEventListener('appinstalled',()=>{dip=null;render()});
const isApp=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true,isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent);
function instCard(){if(isApp())return'';return`<div class="card"><div class="row"><span class="sp"><b>Install this app</b><br><span class="mu">${isIOS()&&!dip?'On iPhone: tap the Share button, then Add to Home Screen.':'Adds an icon to your home screen.'}</span></span>${isIOS()&&!dip?'':'<button class="b" onclick="doInstall()">Install app</button>'}</div></div>`}
async function doInstall(){if(dip){dip.prompt();await dip.userChoice;dip=null;render()}else alert('Open your browser menu and choose "Install app" or "Add to Home screen".')}
const loginHtml=()=>`${instCard()}<div class="card"><h2>Household Money</h2><p class="mu">Sign in with your own email.</p><label>Email</label><input id="l_e" type="email" autocomplete="email"><label>Password</label><input id="l_p" type="password" autocomplete="current-password"><p class="row"><button class="b" onclick="doLogin(0)">Sign in</button><button class="g b" onclick="doLogin(1)">Create account</button></p></div>`;
function doLogin(n){const e=$('#l_e').value.trim(),p=$('#l_p').value;(n?auth.createUserWithEmailAndPassword(e,p):auth.signInWithEmailAndPassword(e,p)).catch(x=>alert(x.message))}
async function enablePush(q){try{if(!('serviceWorker' in navigator)||!firebase.messaging.isSupported())throw new Error('Push is not supported here. On iPhone, add the app to the Home Screen first.');if(await Notification.requestPermission()!=='granted'){render();return}const reg=await navigator.serviceWorker.ready,t=await firebase.messaging().getToken({vapidKey:FB.vapidKey,serviceWorkerRegistration:reg});await col().doc('tk').set({token:t,tz:Intl.DateTimeFormat().resolvedOptions().timeZone,at:Date.now()});render()}catch(e){if(!q)alert('Could not enable push: '+e.message)}}
function handleLink(){const q=new URLSearchParams(location.search),cid=q.get('cid'),dt=q.get('d'),r=q.get('r');if(!cid||!dt)return;history.replaceState(null,'',location.pathname);let n=0;const go=()=>{if(!classes.find(x=>x.id===cid)){if(n++<20)setTimeout(go,500);return}r==='yes'?setSt(cid,dt,'completed'):askNo(cid,dt)};go()}
function banner(){const d=document.createElement('div');d.style.cssText='position:fixed;top:0;left:0;right:0;padding:10px;background:var(--ac);color:#fff;text-align:center;z-index:20';d.innerHTML='A new version is available. <button class="b" style="background:#fff;color:#000">Update</button>';d.querySelector('button').onclick=()=>navigator.serviceWorker.getRegistration().then(r=>r&&r.waiting&&r.waiting.postMessage('skip'));document.body.appendChild(d)}
if('serviceWorker' in navigator){const had=!!navigator.serviceWorker.controller;navigator.serviceWorker.register('sw.js').then(r=>r.addEventListener('updatefound',()=>{const w=r.installing;w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)banner()})}));let rl=0;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!rl){rl=1;location.reload()}})}
let auth;try{firebase.initializeApp(FB.config);auth=firebase.auth();db=firebase.firestore();
auth.onAuthStateChanged(u=>{if(!u){uid=null;me=null;render();return}uid=u.uid;db.collection('profiles').onSnapshot(q=>{profiles={};q.docs.forEach(d=>profiles[d.id]=d.data());if(profiles[uid]&&!me){me=profiles[uid];start();handleLink()}render()},()=>{});render()})}catch(e){$('#app').textContent='Setup needed: fill in firebase-config.js ('+e.message+')'}
</script></body></html>
