const onboardHtml=()=>`<div class="card"><h2>Welcome</h2><label>Your name</label><input id="ob_n" placeholder="Your first name"></div>${emInv?`<div class="card" style="border-color:var(--ok)"><h3>${esc(emInv.name||'Your partner')} invited you</h3><p class="mu">Type your name above, then join to share the budget, schedule, debts and savings.</p><button class="b" onclick="joinHouse('${emInv.code}')">Join ${esc(emInv.name||'their')} household</button></div>`:''}<div class="card"><h3>Start a new household</h3><p class="mu">You can invite your partner afterwards from Settings.</p><button class="b" onclick="createHouse()">Create household</button></div><div class="card"><h3>Join your partner</h3><p class="mu">Enter the invite code they sent you.</p><input id="ob_c" value="${esc(new URLSearchParams(location.search).get('join')||'')}" placeholder="INVITE CODE" style="text-transform:uppercase"><p><button class="b" onclick="joinHouse()">Join household</button></p></div><p><button class="g b" onclick="auth.signOut().then(()=>location.reload())">Sign out</button></p>`;
async function createHouse(){const n=$('#ob_n').value.trim();if(!n)return alert('Please enter your name');try{const h=db.collection('households').doc().id,b=db.batch();b.set(db.doc('households/'+h),{owner:uid,at:Date.now()});b.set(db.doc('households/'+h+'/members/'+uid),{name:n,at:Date.now()});b.set(db.doc('users/'+uid),{name:n,hid:h});await b.commit();location.href=location.pathname}catch(e){alert('Could not create the household: '+e.message)}}
async function joinHouse(c){const n=$('#ob_n').value.trim(),code=(typeof c==='string'&&c?c:$('#ob_c').value).trim().toUpperCase();if(!n)return alert('Please enter your name');if(!code)return alert('Please enter the invite code');try{const inv=await db.doc('invites/'+code).get();if(!inv.exists||inv.data().used)return alert('That invite code is not valid or has already been used');const h=inv.data().hid,b=db.batch();b.set(db.doc('households/'+h+'/members/'+uid),{name:n,code,at:Date.now()});b.update(db.doc('invites/'+code),{used:true,usedBy:uid});b.set(db.doc('users/'+uid),{name:n,hid:h});await b.commit();location.href=location.pathname}catch(e){alert('Could not join: '+e.message)}}
function invite(){sheet(`<h3>Invite your partner</h3><p class="mu">Type the email your partner will sign up with. When they create their account with that email, the app offers them your household straight away. You can also send them a link.</p><label>Partner's email</label><input id="inv_e" type="email" placeholder="partner@email.com"><p class="row"><button class="b" onclick="mkInvite()">Create invite</button><button class="g b" onclick="closeSheet()">Cancel</button></p>`)}
async function mkInvite(){const em=($('#inv_e').value||'').trim().toLowerCase();if(!em||!/^\S+@\S+\.\S+$/.test(em))return alert('Please enter your partner\'s email address');try{const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',code=Array.from(crypto.getRandomValues(new Uint8Array(8))).map(x=>A[x%32]).join(''),link=location.origin+location.pathname+'?join='+code;await db.doc('invites/'+code).set({hid,by:uid,used:false,at:Date.now()});await db.doc('invites/em_'+em).set({hid,by:uid,code,name:me.name,email:em,used:false,at:Date.now()});
 const body=encodeURIComponent('Hi, I set up our household budget app. Create your account with this email address ('+em+') and you will be offered to join me automatically. Or use this link: '+link+' (code '+code+')');
 sheet(`<h3>Invite created</h3><p class="mu">${esc(em)} will be offered your household when they create an account with that email. The code below also works once.</p><label>Invite code</label><input readonly value="${code}" onclick="this.select()"><label>Invite link</label><input readonly value="${esc(link)}" onclick="this.select()"><p class="row"><a class="b" style="text-decoration:none" href="mailto:${esc(em)}?subject=${encodeURIComponent('Join my household budget')}&body=${body}">Send by email</a><button class="b" onclick="navigator.share?navigator.share({title:'Join my household',text:'Join my household budget. Code: ${code}',url:'${esc(link)}'}):(navigator.clipboard&&navigator.clipboard.writeText('${esc(link)}'),alert('Link copied'))">Share</button><button class="g b" onclick="closeSheet()">Close</button></p>`)}catch(e){alert('Could not create an invite: '+e.message)}}
let emInv=null;
async function chkEm(u){emInv=null;try{if(!u.email)return;const d=await db.doc('invites/em_'+u.email.toLowerCase()).get();if(d.exists&&!d.data().used){const c=d.data().code,ci=await db.doc('invites/'+c).get();if(ci.exists&&!ci.data().used)emInv={code:c,name:d.data().name}}}catch(e){}}
function forgot(){const e=$('#l_e').value.trim();if(!e)return alert('Type your email first');auth.sendPasswordResetEmail(e).then(()=>alert('Password reset email sent')).catch(x=>alert(x.message))}
const loginHtml=()=>`${instCard()}<div class="card"><h2>Household Money</h2><p class="mu">Sign in with your own email.</p><label>Email</label><input id="l_e" type="email" autocomplete="email"><label>Password</label><input id="l_p" type="password" autocomplete="current-password"><p class="row"><button class="b" onclick="doLogin(0)">Sign in</button><button class="g b" onclick="doLogin(1)">Create account</button></p><p><a href="#" onclick="forgot();return false" style="color:var(--ac)">Forgot password?</a></p></div>`;
function doLogin(n){const e=$('#l_e').value.trim(),p=$('#l_p').value;(n?auth.createUserWithEmailAndPassword(e,p):auth.signInWithEmailAndPassword(e,p)).catch(x=>alert(x.message))}
async function enablePush(q){try{if(!('serviceWorker' in navigator)||!firebase.messaging.isSupported())throw new Error('Push is not supported here. On iPhone, add the app to the Home Screen first.');if(await Notification.requestPermission()!=='granted'){render();return}const reg=await navigator.serviceWorker.ready,t=await firebase.messaging().getToken({vapidKey:FB.vapidKey,serviceWorkerRegistration:reg});await col().doc('tk').set({token:t,tz:Intl.DateTimeFormat().resolvedOptions().timeZone,at:Date.now()});render()}catch(e){if(!q)alert('Could not enable push: '+e.message)}}
function handleLink(){const q=new URLSearchParams(location.search),cid=q.get('cid'),dt=q.get('d'),r=q.get('r');if(!cid||!dt)return;history.replaceState(null,'',location.pathname);let n=0;const go=()=>{if(!classes.find(x=>x.id===cid)){if(n++<20)setTimeout(go,500);return}r==='yes'?setSt(cid,dt,'completed'):askNo(cid,dt)};go()}
function banner(){const d=document.createElement('div');d.style.cssText='position:fixed;top:0;left:0;right:0;padding:10px;background:var(--ac);color:#fff;text-align:center;z-index:20';d.innerHTML='A new version is available. <button class="b" style="background:#fff;color:#000">Update</button>';d.querySelector('button').onclick=()=>navigator.serviceWorker.getRegistration().then(r=>r&&r.waiting&&r.waiting.postMessage('skip'));document.body.appendChild(d)}
if('serviceWorker' in navigator){const had=!!navigator.serviceWorker.controller;navigator.serviceWorker.register('sw.js').then(r=>r.addEventListener('updatefound',()=>{const w=r.installing;w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)banner()})}));let rl=0;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!rl){rl=1;location.reload()}})}
let auth;try{applyTheme();firebase.initializeApp(FB.config);auth=firebase.auth();db=firebase.firestore();
auth.onAuthStateChanged(async u=>{if(!u){uid=null;me=null;hid=null;render();return}uid=u.uid;
 if(MULTI){try{const d=await db.doc('users/'+uid).get();if(d.exists&&d.data().hid){hid=d.data().hid;me={name:d.data().name}}}catch(e){alert('Could not load your account: '+e.message)}if(!hid){await chkEm(u);render();return}}
 db.collection(H('members')).onSnapshot(q=>{profiles={};q.docs.forEach(d=>profiles[d.id]=d.data());if(!MULTI&&profiles[uid]&&!me)me=profiles[uid];if(me&&!started){start();handleLink()}render()},()=>{});render()})}catch(e){$('#app').textContent='Setup needed: fill in firebase-config.js ('+e.message+')'}
</script></body></html>
